name: Smoketest / Informative / Alma
on:
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  test:
    name: Compilers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 8 is the oldest Alma Linux to exist
          - alma: "8"
            compiler: g++
            build-type: Debug
          - alma: "8"
            compiler: g++
            build-type: Release
          - alma: "8"
            compiler: clang++
            build-type: Debug
          - alma: "8"
            compiler: clang++
            build-type: Release
          # Alma 9 ships Clang 20 and that cannot build against Boost MPL older than 1.86, and Alma 9 ships 1.75
          - alma: "9"
            compiler: g++
            build-type: Debug
          - alma: "9"
            compiler: g++
            build-type: Release
          - alma: "10"
            compiler: g++
            build-type: Debug
          - alma: "10"
            compiler: g++
            build-type: Release
          - alma: "10"
            compiler: clang++
            build-type: Debug
          - alma: "10"
            compiler: clang++
            build-type: Release
          # 11 is expected in 2028-05
          # 12 is expected in 2031-05
    container: almalinux:${{ matrix.alma }}
    steps:
      - name: Install Dependencies
        run: |
          dnf -qy update
          # We need to add an extra command to DNF to manage its config
          dnf install -qy 'dnf-command(config-manager)'
          # We need either PowerTools or CodeReady Builder
          # Alma 8 has PowerTools, Alma 9 has CodeReady Builder
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
          # We need packages from EPEL
          dnf install -qy epel-release
          dnf install -qy \
            git \
            cmake \
            gcc-c++ \
            clang \
            ccache \
            boost-devel \
            zlib-devel \
            mesa-libGL-devel \
            glew-devel \
            freetype-devel \
            SDL2-devel \
            SDL2_image-devel \
            SDL2_mixer-devel \
            SDL2_ttf-devel \
            libogg-devel \
            libvorbis-devel \
            cairo-devel

      - name: Checkout Anura
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only write to cache on scheduled builds on trunk
      # Don't restore when creating and saving cache
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ${{ github.job }}-alma-${{ matrix.alma }}-${{ matrix.compiler }}-${{ matrix.build-type }}
          append-timestamp: false
          save: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}
          restore: ! ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            -L unittest
