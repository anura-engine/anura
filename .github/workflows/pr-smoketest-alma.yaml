name: Smoketest / Informative / Alma
on:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  test:
    name: Compilers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        alma:
          # 8 is the oldest Alma Linux to exist
          - "8"
          - "9"
          # 10 is expected in 2025-05
          # 11 is expected in 2028-05
          # 12 is expected in 2031-05
        compiler:
          - g++
          - clang++
        build-type:
          - Release
          - Debug
    container: almalinux:${{ matrix.alma }}
    steps:
      - name: Install Dependencies
        run: |
            dnf -qy update
            # We need to add an extra command to DNF to manage its config
            dnf install -qy 'dnf-command(config-manager)'
            # We need either PowerTools or CodeReady Builder
            # Alma 8 has PowerTools, Alma 9 has CodeReady Builder
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
            # We need packages from EPEL
            dnf install -qy epel-release
            dnf install -qy \
              git \
              cmake \
              gcc-c++ \
              clang \
              ccache \
              boost-devel \
              zlib-devel \
              mesa-libGL-devel \
              glew-devel \
              freetype-devel \
              SDL2-devel \
              SDL2_image-devel \
              SDL2_mixer-devel \
              SDL2_ttf-devel \
              libogg-devel \
              libvorbis-devel \
              cairo-devel

      - name: Checkout Anura
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Only write to cache on pushes to trunk
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@bfa03e1de4d7f7c3e80ad9109feedd05c4f5a716 # v1.2.19
        with:
          key: ${{ github.job }}-alma-${{ matrix.alma }}-${{ matrix.compiler }}-${{ matrix.build-type }}
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trunk' }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            -L unittest
