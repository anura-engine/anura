name: Smoketest / Informative / Alma
on:
  pull_request:

jobs:
  test:
    name: Compilers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        alma:
          # 8 is the oldest Alma Linux to exist
          - "8"
          - "9"
          # 10 is expected in 2025-05
          # 11 is expected in 2028-05
          # 12 is expected in 2031-05
        compiler:
          - g++
          - clang++
        build-type:
          - Release
          - Debug
    container: almalinux:${{ matrix.alma }}
    steps:
      - name: Install Dependencies
        run: |
            dnf -qy update
            # We need to add an extra command to DNF to manage its config
            dnf install -qy 'dnf-command(config-manager)'
            # We need either PowerTools or CodeReady Builder
            # Alma 8 has PowerTools, Alma 9 has CodeReady Builder
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
            # We need packages from EPEL
            dnf install -qy epel-release
            dnf install -qy \
              git \
              cmake \
              gcc-c++ \
              clang \
              ccache \
              boost-devel \
              zlib-devel \
              mesa-libGL-devel \
              glew-devel \
              freetype-devel \
              glm-devel \
              SDL2-devel \
              SDL2_image-devel \
              SDL2_mixer-devel \
              SDL2_ttf-devel \
              libogg-devel \
              libvorbis-devel \
              cairo-devel

      - name: Checkout Anura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            submodules: true

      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1 # v1.2.18
        with:
          key: ${{ github.job }}-alma-${{ matrix.alma }}-${{ matrix.compiler }}-${{ matrix.build-type }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
          -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
          -D CMAKE_BUILD_TYPE="${{ matrix.build-type }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          make -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: ./anura --tests
