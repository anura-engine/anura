name: Dependabot Auto Approve

on: pull_request

concurrency:
  group: dependabot-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  dependabot-auto-approve:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Create app token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.AUTOAPPROVE_APP_ID }}
          private-key: ${{ secrets.AUTOAPPROVE_APP_PRIVATE_KEY }}

      - name: Wait for status checks
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          while :; do
            checks=$(gh pr checks "$PR_URL" --json name,bucket)
            state=$(jq -r '
              map(select(.name != "dependabot-auto-approve")) as $checks |
              if ($checks | length) == 0 then "pending"
              elif any($checks[]; .bucket == "fail" or .bucket == "cancel") then "failed"
              elif any($checks[]; .bucket == "pending") then "pending"
              elif all($checks[]; .bucket == "pass" or .bucket == "skipping") then "done"
              else "failed"
              end
            ' <<< "$checks")

            case "$state" in
              done)
                echo "All checks passed or were skipped."
                exit 0
                ;;
              failed)
                echo "A check failed, was canceled, or has an unknown state."
                exit 1
                ;;
              pending)
                echo "Checks are still pending; retrying in 5 minutes."
                sleep 300
                ;;
            esac
          done

      - name: Auto Approve Dependabot PRs
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr review --approve "$PR_URL"
