name: Dependabot Auto Approve

on: pull_request

concurrency:
  group: dependabot-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

concurrency:
  group: dependabot-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  dependabot-auto-approve:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Create app token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.AUTOAPPROVE_APP_ID }}
          private-key: ${{ secrets.AUTOAPPROVE_APP_PRIVATE_KEY }}

      - name: Wait for status checks
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWN_CHECK: "dependabot-auto-approve"
        run: |
          set -euo pipefail

          max_attempts=100
          first_success_seen=false

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            checks=$(gh pr checks "$PR_URL" --json name,bucket)
            other_checks=$(jq -c --arg own_check "$OWN_CHECK" \
              '[.[] | select(.name != $own_check)]' <<< "$checks")

            failed_checks=$(jq -c \
              '[.[] | select(.bucket == "fail" or .bucket == "cancel" or (.bucket != "pass" and .bucket != "pending" and .bucket != "skipping"))]' \
              <<< "$other_checks")
            if [[ $(jq 'length' <<< "$failed_checks") -gt 0 ]]; then
              jq -r '.[] | "\(.bucket): \(.name)"' <<< "$failed_checks"
              echo "At least one check did not succeed; refusing to approve."
              exit 1
            fi

            check_count=$(jq 'length' <<< "$other_checks")
            pending_count=$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$other_checks")
            success_count=$(jq '[.[] | select(.bucket == "pass")] | length' <<< "$other_checks")

            if [[ "$success_count" -gt 0 && "$first_success_seen" == false ]]; then
              first_success_seen=true
              echo "A check has succeeded; rechecking all checks after 30 seconds."
            elif [[ "$check_count" -gt 0 && "$pending_count" -eq 0 && "$first_success_seen" == true ]]; then
              echo "All checks have completed successfully or were skipped."
              exit 0
            else
              echo "Checks: $success_count successful, $pending_count pending."
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Timed out waiting for checks; refusing to approve."
              exit 1
            fi

            sleep 30
          done

      - name: Auto Approve Dependabot PRs
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr review --approve "$PR_URL"
