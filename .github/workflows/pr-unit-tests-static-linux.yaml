name: Unit Tests / Required / Static / Linux
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  build:
    name: Build and Test in Steam SDK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # XXX - This matrix needs to stay in sync with the test job below!
        compiler:
          # Only g++ builds actually work currently
          - g++
        build-type:
          - Release
          - Debug
        steam-runtime:
          # - scout v1 - Debian Stretch  / 9 - has a glibc too old for Github Actions / Node 20
          # - soldier v2 - Debian Buster / 10 - has a weird compiler and a weird ld, no idea what is up there
          - sniper # v3 - Debian Bullseye / 11
          # - medic v4 - Debian Bookworm / 12 - not in the container registry yet
          # - ??? v5 - Debian Trixie / 13 - not in the container registry yet
    container: registry.gitlab.steamos.cloud/steamrt/${{ matrix.steam-runtime }}/sdk
    steps:
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo ln -fs /usr/share/zoneinfo/UTC /etc/localtime
          sudo dpkg-reconfigure --frontend=noninteractive tzdata
          sudo apt-get -qq update
          sudo apt-get -qq upgrade -y
          sudo apt-get -qq --no-install-recommends install -y \
            python3-venv \
            libfontenc-dev \
            libxmuu-dev \
            libxres-dev

      - name: Checkout Anura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ignore Filesystem Permissions for Git
        run: git config --global --add safe.directory '*'

      # Only write to cache on scheduled builds on trunk
      # Don't restore when creating and saving cache
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: unit-tests-linux-static-steam-${{ matrix.build-type }}-${{ matrix.compiler }}-${{ matrix.steam-runtime }}
          append-timestamp: false
          save: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}
          restore: ${{ ! (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}

      - name: Install Conan
        uses: conan-io/setup-conan@5db0275587014d13a5ca698db681ce4782a6e052 # v1.5.0
        with:
          version: 2.33.0
          use_venv: true

      # Restore the newest scheduled cache for this matrix configuration.
      - name: Restore Conan Cache
        if: ${{ ! (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-linux-static-steam-${{ matrix.build-type }}-${{ matrix.compiler }}-${{ matrix.steam-runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            conan-linux-static-steam-${{ matrix.build-type }}-${{ matrix.compiler }}-${{ matrix.steam-runtime }}-
            conan-linux-static-steam-${{ matrix.build-type }}-${{ matrix.compiler }}-${{ matrix.steam-runtime }}

      - name: Install Dependencies with Conan
        run: |
          # XXX - We need to force build b2 as Conan assumes a too new libc++
          # Conan Center's bison binary requires a newer glibc than Steam Sniper.
          conan install buildsystem/conan \
            --lockfile=buildsystem/conan.lock \
            -s build_type="${{ matrix.build-type }}" \
            -s compiler.cppstd=17 \
            --build='bison/*' \
            --build='b2/*' \
            --build='m4/*' \
            --build=missing

      # Only write to cache on scheduled builds on trunk
      - name: Save Conan Cache
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/trunk'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-linux-static-steam-${{ matrix.build-type }}-${{ matrix.compiler }}-${{ matrix.steam-runtime }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-steam \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-steam/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-steam/build/"${{ matrix.build-type }}" \
            -L unittest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anura-static-binary-${{ matrix.build-type }}-${{ matrix.steam-runtime }}-${{ matrix.compiler }}-${{ github.sha }}
          path: buildsystem/linux-steam/build/${{ matrix.build-type }}/anura
          if-no-files-found: error

  test:
    name: Test on Steam Platform
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # XXX - This matrix needs to stay in sync with the build job above!
        compiler:
          # Only g++ builds actually work currently
          - g++
        build-type:
          - Release
          - Debug
        steam-runtime:
          # - scout v1 - Debian Stretch  / 9 - has a glibc too old for Github Actions / Node 20
          # - soldier v2 - Debian Buster / 10 - has a weird compiler and a weird ld, no idea what is up there
          - sniper # v3 - Debian Bullseye / 11
          # - medic v4 - Debian Bookworm / 12 - not in the container registry yet
          # - ??? v5 - Debian Trixie / 13 - not in the container registry yet
    container: registry.gitlab.steamos.cloud/steamrt/${{ matrix.steam-runtime }}/platform
    steps:
      - name: Checkout Anura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anura-static-binary-${{ matrix.build-type }}-${{ matrix.steam-runtime }}-${{ matrix.compiler }}-${{ github.sha }}

      - name: Run Unit Tests
        run: |
          chmod +x anura
          ./anura --tests
