name: Unit Tests / Required / Static / Windows
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  build:
    name: Build and Test on Windows
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - Release
          - Debug
    steps:
      - name: Checkout Anura
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
        with:
          cmake-version: 4.4.3

      # Save on PRs, merge groups, and scheduled builds on trunk.
      # Scheduled trunk runs refresh the base cache from a clean build.
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: unit-tests-windows-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unit-tests-windows-${{ matrix.build-type }}-
            unit-tests-windows-${{ matrix.build-type }}
          append-timestamp: false
          save: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}
          restore: ${{ ! (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}

      - name: Install Conan
        uses: conan-io/setup-conan@09566912d661de90608308897a4d513e850c04e8 # v1.2.0
        with:
          use_venv: true

      # Restore the latest cache for this matrix configuration.
      - name: Restore Conan Cache
        if: ${{ ! (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-windows-static-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            conan-windows-static-${{ matrix.build-type }}-
            conan-windows-static-${{ matrix.build-type }}

      - name: Install Dependencies with Conan
        run: |
          $cmakePath = (Get-Command cmake).Source
          conan install buildsystem/conan `
            -s build_type="${{ matrix.build-type }}" `
            -s compiler.cppstd=17 `
            -c "tools.cmake:cmake_program=$cmakePath" `
            -c "tools.cmake.cmaketoolchain:generator=Visual Studio 18 2026" `
            --build=missing

      # Save on PRs, merge groups, and scheduled builds on trunk.
      - name: Save Conan Cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-windows-static-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/windows-static `
            --preset="${{ matrix.build-type }}"

      - name: Build Anura
        run: |
          cmake --build "buildsystem/windows-static/build/${{ matrix.build-type }}" `
            --config "${{ matrix.build-type }}" `
            --parallel

      - name: Run Anura unit tests
        timeout-minutes: 5
        run: |
          & "buildsystem/windows-static/build/${{ matrix.build-type }}/${{ matrix.build-type }}/anura.exe" --tests --log-file=unit-tests.log

      - name: Print Anura unit test log
        if: always()
        run: |
          if (Test-Path "unit-tests.log") {
            Get-Content "unit-tests.log"
          } else {
            Write-Host "Unit test log was not created."
          }
