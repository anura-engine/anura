name: Smoketest / Informative / openSUSE Leap
on:
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  test:
    name: Compilers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suse:
          # 16.0 is the oldest openSUSE Leap with a new enough libboost
          - "16.0"
          # 16.1 is expected in 2026-06
          # 16.2 is expected in 2027-06
        compiler:
          - g++
          - clang++
        build-type:
          - Release
          - Debug
    container: opensuse/leap:${{ matrix.suse }}
    steps:
      - name: Install Dependencies
        run: |
          zypper -q --non-interactive update
          zypper -q --non-interactive install \
            tar \
            gzip \
            git \
            gcc-c++ \
            clang \
            llvm-gold-provider \
            cmake \
            make \
            ccache \
            libboost_filesystem-devel \
            libboost_locale-devel \
            libboost_regex-devel \
            libboost_system-devel \
            cairo-devel \
            glew-devel \
            boost-devel \
            libicu-devel \
            libSDL2_image-devel \
            libSDL2_mixer-devel \
            libSDL2_ttf-devel \
            libSDL2-devel \
            libvorbis-devel \
            libjack

      - name: Checkout Anura
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only write to cache on scheduled builds on trunk
      # Don't restore when creating and saving cache
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ${{ github.job }}-opensuse-leap-${{ matrix.suse }}-${{ matrix.compiler }}-${{ matrix.build-type }}
          append-timestamp: false
          save: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}
          restore: ${{ ! (github.event_name == 'schedule' && github.ref == 'refs/heads/trunk') }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            -L unittest
