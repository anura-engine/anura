name: Unit Tests / Required / Dynamic / Linux
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  test:
    name: Ubuntu
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        build-type:
          - Release
          - Debug
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq upgrade -y
          sudo apt-get -qq install -y --no-install-recommends \
            ca-certificates \
            git \
            clang \
            cmake \
            make \
            ccache \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-locale-dev \
            libboost-regex-dev \
            libboost-system-dev \
            libcairo2-dev \
            libglew-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libvorbis-dev

      - name: Checkout Anura
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Only write to cache on scheduled builds on trunk
      # Don't restore when creating and saving cache
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: unit-tests-linux-${{ matrix.build-type }}-${{ matrix.runner }}
          append-timestamp: false
          save: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}
          restore: ! ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/trunk' }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="clang++"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            -L unittest
