name: Smoketest / Informative / Ubuntu
on:
  pull_request:
  push:
    branches:
      - trunk
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  test:
    name: Compilers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Versions between LTS are not available for long - we only do LTS
        ubuntu:
          # 22.04 is the oldest LTS with a new enough CMake for our FetchContent workarounds
          - "22.04"
          - "24.04"
          # 26.04 LTS is expected in 2026-04
          # 28.04 LTS is expected in 2028-04
        compiler:
          - g++
          - clang++
        build-type:
          - Release
          - Debug
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -qq update
          apt-get -qq upgrade -y
          apt-get -qq install -y --no-install-recommends \
            apt-file
          apt-file update
          apt-get -qq install -y --no-install-recommends \
            ca-certificates \
            git \
            g++ \
            clang \
            llvm-dev \
            cmake \
            make \
            ccache \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-locale-dev \
            libboost-regex-dev \
            libboost-system-dev \
            libcairo2-dev \
            libglew-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libvorbis-dev

      - name: Checkout Anura
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      # Only write to cache on pushes to trunk
      - name: Set ccache up
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ${{ github.job }}-ubuntu-${{ matrix.ubuntu }}-${{ matrix.compiler }}-${{ matrix.build-type }}
          save: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/trunk' }}

      - name: Build Prep Anura
        run: |
          cmake buildsystem/linux-dynamic \
            --preset="${{ matrix.build-type }}" \
            -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"

      - name: Build Anura
        run: |
          # Compile with number of available hyperthreads
          cmake \
            --build buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run Unit Tests
        run: |
          ctest \
            --output-on-failure \
            --test-dir buildsystem/linux-dynamic/build/"${{ matrix.build-type }}" \
            -L unittest
